name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: 'Signierter Testbuild (nur main, kein Release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-upgrade:
    name: Signed app upgrade and recovery
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Exercise signed upgrades with an ephemeral test key
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/Test-UpgradeFaults.ps1
          if($LASTEXITCODE -ne 0){throw 'Upgrade fault helper tests failed.'}
          ./tests/Test-AppUpgrade.ps1
      - name: Upload upgrade evidence (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-upgrade-evidence
          path: artifacts/upgrade-tests/**
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DRIVERPILOT_SIGN_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign) }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Adversarial package tests (ephemeral keys, no production bypass)
        run: |
          ./tests/Test-PackageSecurity.ps1
      - name: Offline hardware routing and sharing regressions
        run: |
          dotnet run --project tests/HardwareRouting/HardwareRouting.csproj
          if($LASTEXITCODE -ne 0){throw 'Hardware routing tests failed.'}
          dotnet run --project tests/SystemReport/SystemReport.csproj -- --integration
          if($LASTEXITCODE -ne 0){throw 'System report tests failed.'}
      - name: Import private release signing key
        if: env.DRIVERPILOT_SIGN_RELEASE == 'true'
        env:
          DRIVERPILOT_SIGNING_PFX: ${{ secrets.DRIVERPILOT_SIGNING_PFX }}
          DRIVERPILOT_SIGNING_PASSWORD: ${{ secrets.DRIVERPILOT_SIGNING_PASSWORD }}
        run: ./build/Initialize-CISigning.ps1
      - name: Build self-contained Windows application
        run: ./build/Build.ps1 -Sign:($env:DRIVERPILOT_SIGN_RELEASE -eq 'true')
      - name: Run application and transport tests
        run: ./tests/Test-Pipeline.ps1
      - name: Verify native application icons
        run: |
          [xml]$project=Get-Content -LiteralPath src/DriverPilot/DriverPilot.csproj
          $exe=Join-Path $PWD ("artifacts/release-"+$project.Project.PropertyGroup.Version+"/DriverPilot.exe")
          dotnet run --project tests/AppIcon/AppIcon.Tests.csproj -c Debug -- $exe
          if($LASTEXITCODE -ne 0){throw 'Debug icon verification failed.'}
          dotnet run --project tests/AppIcon/AppIcon.Tests.csproj -c Release -- $exe
          if($LASTEXITCODE -ne 0){throw 'Release icon verification failed.'}
      - name: Package installer and ZIP
        if: env.DRIVERPILOT_SIGN_RELEASE == 'true'
        run: ./build/Build-Release.ps1 -Sign:($env:DRIVERPILOT_SIGN_RELEASE -eq 'true')
      - name: Verify signatures and reject tampering
        if: env.DRIVERPILOT_SIGN_RELEASE == 'true'
        run: ./tests/Test-Signing.ps1
      - name: Test installation on disposable runner
        if: env.DRIVERPILOT_SIGN_RELEASE == 'true'
        run: ./tests/Test-Pipeline.ps1 -Installer
      - name: Remove runner signing key and temporary trust
        if: always() && env.DRIVERPILOT_SIGN_RELEASE == 'true'
        run: ./build/Remove-CISigning.ps1
      - name: Upload release files
        if: env.DRIVERPILOT_SIGN_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-release
          path: |
            artifacts/dist/*-Setup-x64.exe
            artifacts/dist/*-win-x64.zip
            artifacts/dist/SHA256SUMS.txt
            artifacts/dist/DriverPilot.cer
            artifacts/dist/ZERTIFIKAT-ANLEITUNG.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics
          path: |
            artifacts/release-*/*results.txt
            artifacts/release-*/*failure.txt
            artifacts/dist/installer-test.log
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, app-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-release
          path: dist
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --notes "Privat signierte Ausgabe. Vor der Installation ZERTIFIKAT-ANLEITUNG.txt lesen und den Zertifikat-Fingerabdruck direkt mit Christian abgleichen. DriverPilot.cer enthaelt nur den oeffentlichen Schluessel. SmartScreen/Smart App Control koennen weiterhin warnen oder blockieren." --title "DriverPilot $RELEASE_TAG"
